    <title>Odtwarzacz</title>
    <script src="script.js" defer></script>
    <script src="log.js" defer></script>

    <body>
        <div class="auth-form" id="login-form">
            <h2>Logowanie</h2>
            <input type="text" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Hasło">
            <button type="button" onclick="login()">Zaloguj się</button>

            <p>Nie masz jeszcze konta? <a href="#" onclick="toggleForm()">Zarejestruj się</a></p>
        </div>
        
        <div class="auth-form" id="register-form" style="display: none;">
            <h2>Rejestracja</h2>
            <input type="text" id="new-email" placeholder="Email">
            <input type="password" id="new-password" placeholder="Hasło">
            <button type="button" onclick="register()">Zarejestruj się</button>
            <p>Masz już konto? <a href="#" onclick="toggleForm()">Zaloguj się</a></p>
        </div>
                


        <div class="odtwarzacz">
           
            <div class="obwod">

                <div class="funkcje">
                        <div class="search"> <input type="text" id="search-input" placeholder="Szukaj piosenki"> </div>
                            <div class="now-playing">Odtwarzanie x z y </div>
                            <div class="okladka"></div>
                            <div class="nazwa-utw">Nazwa utworu </div>
                            <div class="artysta">Nazwa artysty</div>
                </div>

            
                
                <div class="slider">
                   <div class="current-time">00:00</div>
                   <input type="range" min="1" max="100" value="0" class="seek_slider" onchange="przewin()">
                   <div class="total-duration">00:00</div>
                </div>

                <div class="slider">
                    <i class="fa-solid fa-volume-high" onclick="toggle_mute()"></i>
                    <input type="range" min="0" max="100" value="99" class="vol_slider" onchange="set_vol()">
                </div>


           <div class="button">
               <div class="losowy" onclick="losowy_utwor()">
               <i class="fa-solid fa-shuffle shuffle-button"></i>
               </div>
               <div class="poprzedni-utwor" onclick="prev_song()">
                    <i class="fa-solid fa-backward-step"></i>
                </div>
                <div class="play" onclick="playpause_song()">
                    <i class="fa-solid fa-play"></i>
                </div>
                <div class="nastepny-utwor" onclick="next_song()">
                    <i class="fa-solid fa-forward-step"></i>
                </div>
                <div class="powtorz" onclick="repeat_song()">
                    <i class="fa-solid fa-repeat"></i>
                </div>

                
           </div>
        </div>
    
 
    
       
    </div>
    <div class="library">
        <h2>Biblioteka</h2>
        <button onclick="createPlaylist()" class="create-playlist-btn">
            <i class="fas fa-plus"></i> Utwórz playlistę
        </button>
        <ul id="lista_utw"></ul>
